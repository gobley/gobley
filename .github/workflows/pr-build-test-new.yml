name: Build and run tests (new)

on:
  push:
    branches: [ "main*" ]
  pull_request:
    branches: [ "main*" ]

jobs:
  build-and-test:
    name: Build and run unit tests
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test-name:
          - cargo-tests
          - examples
          - gradle-plugin-tests
          - gradle-tests
          - uniffi-tests
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
      - name: Install Zig
        shell: pwsh
        run: ./.github/workflows/pr-build-test-dependencies-zig.ps1
      - name: Install additional dependencies
        shell: pwsh
        run: ./.github/workflows/pr-build-test-dependencies-${{ matrix.os }}.ps1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Install additional required Android SDK packages and configure environment variables
        shell: pwsh
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          "ANDROID_HOME=${env:ANDROID_SDK_ROOT}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run tests
        shell: pwsh
        run: ./.github/workflows/pr-build-test-${{ matrix.test-name }}.ps1
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ matrix.test-name != 'cargo-tests' && (success() || failure()) }}
        with:
          name: junit-test-results-${{ matrix.test-name }}
          path: './**/test-results/*est/TEST-*.xml'
          retention-days: 1